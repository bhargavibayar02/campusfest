services:
  - type: web
    name: campusfest-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
